<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyFarm</title>
<script>document.documentElement.dataset.theme = localStorage.getItem("comfyfarm.theme") || "auto";</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <a class="brand" href="#/">ComfyFarm</a>
  <nav id="nav">
    <a href="#/" data-page="" data-i18n="Dashboard">Dashboard</a>
    <a href="#/comfyui" data-page="comfyui" data-i18n="Workflow">Workflow</a>
    <a href="#/queue" data-page="queue"><span data-i18n="Queue">Queue</span> <span id="qbadge" class="badge" hidden></span></a>
    <a href="#/history" data-page="history" data-i18n="History">History</a>
    <a href="#/admin/workers" data-page="admin" class="admin-only" data-i18n="System">System</a>
  </nav>
  <span class="spacer"></span>
  <span id="updated" class="muted"></span>
  <a href="#/settings" data-page="settings" id="me"></a>
  <a href="/" target="_blank" rel="noopener" title="ComfyUI on its own, in a new tab" data-i18n-title="ComfyUI on its own, in a new tab">ComfyUI ↗</a>
  <a href="/comfyfarm/logout" data-i18n="Log out">Log out</a>
</header>
<div id="stale" class="banner" hidden></div>
<main id="page"></main>
<div id="workflow" hidden></div>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
