[project]
name = "comfyfarm"
version = "0.0.0"
description = "Job router for a farm of ComfyUI workers (CUDA and ROCm)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
fake = ["aiohttp>=3.9"]
dev = ["aiohttp>=3.9", "httpx>=0.27", "websockets>=12", "pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyfarm"]
