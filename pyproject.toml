[project]
name = "comfyfarm"
version = "0.0.0"
description = "Job router for a farm of ComfyUI workers (CUDA and ROCm)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "asyncpg>=0.29", "httpx>=0.27", "websockets>=13", "python-multipart>=0.0.9"]

[project.optional-dependencies]
fake = ["aiohttp>=3.9"]
dev = ["aiohttp>=3.9", "pytest>=8", "pytest-asyncio>=0.23", "pgserver>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyfarm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
