# ComfyFarm control plane, the easy way:
#
#   docker compose up -d                      (pulls the image from ghcr.io; -d keeps it running)
#   docker compose logs router | grep "setup code"
#   open http://<this host>:8080 — create the administrator with that code
#
# Nothing to edit first. On the first start the builder builds ComfyUI for the UI worker (this host needs internet for
# that: a minute or two, ~2.5 GB) and the router starts it — workflows open before any GPU worker exists. Then the
# dashboard's "Getting started" list takes you through the rest (docs/guide/install.md, "First day").
#
# Everything the farm keeps — secrets (files, not environment variables), the database, logs, the builder's and the UI
# worker's caches — is in one directory, COMFYFARM_DATA (default /srv/comfyfarm/data): back it up, move it, or delete it
# to start over. Postgres is not published, and the UI worker is not either (only the router and the gateway reach it).
# What "easy" leaves to you: ports 8080 (users) and 8188 (workers, monitoring) open on every address of this host —
# restrict them with your firewall (Docker publishes past ufw), or use ../compose (install.md). Optional settings: a
# .env file next to this one:
#   COMFYFARM_DATA             this control plane's own data, default /srv/comfyfarm/data
#   COMFYFARM_ARTIFACTS_MOUNT  the artifact store, default /srv/comfyfarm/art — GPU workers mount it at the SAME path
#   COMFYFARM_SHARED           input/output/user, default /srv/comfyfarm/shared — the storage GPU workers use too
#   COMFYFARM_UID              the workers' service account uid (default 47800): shared storage belongs to it
#   COMFYFARM_BUILD_NODE_SOURCES  where node packs picked in the dashboard may come from (default https://github.com/;
#                              empty = none) — the builder's setting: the router cannot change it
#   COMFYFARM_FIRST_RECIPE     the recipe whose UI half the first start builds (default rocm-gfx1201; the UI half is the
#                              same in every recipe)
#   ROUTER_PORT, GATEWAY_PORT  <host-ip>:<port> to publish on one address only
name: comfyfarm

x-image: &image
  image: ghcr.io/frozenrainy/comfyfarm:${COMFYFARM_VERSION:-0.1.0-dev.14}
  build:                                    # only for `docker compose build` (a change of your own, a closed network)
    context: ../..
    dockerfile: deploy/Dockerfile
  pull_policy: missing

services:
  init:                                     # makes /state and the builder's and UI worker's directories, then exits
    <<: *image
    # root for these seconds only: bind mounts are created by Docker as root; init gives each to its account — the
    # router (uid 10001), the builder (10002, the artifact store), the workers' account (47800, the shared storage) —
    # and never a directory that already holds someone else's files
    user: "0:0"
    network_mode: none
    command: ["comfyfarm", "prepare", "/state", "--chown", "/var/log/comfyfarm", "--builds", "/builds",
              "--ui-token", "/ui-agent", "--art", "${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}",
              "--shared", "${COMFYFARM_SHARED:-/srv/comfyfarm/shared}", "--builder-home", "/builder-home",
              "--ui-home", "/ui-home", "--farm-uid", "${COMFYFARM_UID:-47800}"]
    volumes:
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/state:/state
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/logs:/var/log/comfyfarm
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/builds:/builds
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/ui-agent:/ui-agent
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/builder-home:/builder-home
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/ui-home:/ui-home
      - ${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}:${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}
      - ${COMFYFARM_SHARED:-/srv/comfyfarm/shared}:${COMFYFARM_SHARED:-/srv/comfyfarm/shared}
    restart: "no"

  db:
    image: postgres:17                      # major 17 = the client tools in the comfyfarm image (backups)
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: comfyfarm
      POSTGRES_DB: comfyfarm
      POSTGRES_PASSWORD_FILE: /state/secrets/db_password
    volumes:
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/db:/var/lib/postgresql/data
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/state:/state:ro
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfyfarm -d comfyfarm"]
      interval: 5s
      retries: 20

  router:
    <<: *image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMFYFARM_DSN: postgresql://comfyfarm@db/comfyfarm
      PGPASSWORD_FILE: /state/secrets/db_password
      COMFYFARM_GATEWAY_SECRET_FILE: /state/secrets/gateway_secret
      COMFYFARM_KEYS_DIR: /state/keys
      COMFYFARM_DEFAULT_GROUP: ${COMFYFARM_DEFAULT_GROUP:-}
      COMFYFARM_ARTIFACTS_DIR: ${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}
      COMFYFARM_BUILDS_DIR: /builds
      COMFYFARM_UI_SERVICE: http://ui:8189
      COMFYFARM_UI_AGENT: http://ui:8399
      COMFYFARM_UI_SHARED: ${COMFYFARM_SHARED:-/srv/comfyfarm/shared}
      COMFYFARM_FIRST_RECIPE: ${COMFYFARM_FIRST_RECIPE:-rocm-gfx1201}
      COMFYFARM_PUBLIC_ROUTER: ${ROUTER_PORT:-8188}          # what workers connect to: the setup form's default
    ports:
      - "${ROUTER_PORT:-8188}:8188"         # workers' launchers, /metrics — not for users' browsers
    volumes:
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/state:/state
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/logs:/var/log/comfyfarm
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/builds:/builds
      - ${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}:${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}:ro
      - ${COMFYFARM_SHARED:-/srv/comfyfarm/shared}/user:/userdata:ro   # the users' workflows: comfyfarm backup --user-dir /userdata
    networks: [db, front]

  gateway:
    <<: *image
    restart: unless-stopped
    depends_on:
      - router
    command: ["comfyfarm-gateway", "--router", "http://router:8188", "--ui", "${UI_WORKER_URL:-auto}",
              "--port", "8080", "--log-dir", "/var/log/comfyfarm"]
    environment:
      COMFYFARM_GATEWAY_SECRET_FILE: /state/secrets/gateway_secret
      COMFYFARM_SESSION_KEY_FILE: /state/secrets/session_key
    ports:
      - "${GATEWAY_PORT:-8080}:8080"        # the address users open
    volumes:
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/state:/state:ro
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/logs:/var/log/comfyfarm
    networks: [front]

  builder:                                  # builds what the dashboard asks for (docs/design/15); owns the artifact store
    <<: *image
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    user: "10002:10002"
    command: ["comfyfarm", "builder", "--art", "${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}"]
    environment:
      HOME: /var/lib/comfyfarm-builder
      UV_CACHE_DIR: /var/lib/comfyfarm-builder/uv-cache
      UV_PYTHON_INSTALL_DIR: /var/lib/comfyfarm-builder/python
      COMFYFARM_BUILD_NODE_SOURCES: ${COMFYFARM_BUILD_NODE_SOURCES-https://github.com/}
    volumes:
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/builds:/builds
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/builder-home:/var/lib/comfyfarm-builder
      - ${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}:${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}
    networks: [build]                       # internet (PyPI, PyTorch, GitHub); not the router's or the database's

  ui:                                       # the UI worker: ComfyUI on the CPU for the screen and the users' files
    <<: *image
    restart: unless-stopped
    depends_on:
      - router
    user: "${COMFYFARM_UID:-47800}:${COMFYFARM_UID:-47800}"
    command: ["comfyfarm", "ui-worker"]
    environment:
      COMFYFARM_ROUTER: http://router:8188
      COMFYFARM_ARTIFACTS: ${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}
      COMFYFARM_SHARED: ${COMFYFARM_SHARED:-/srv/comfyfarm/shared}
      COMFYFARM_UI_HOME: /var/lib/comfyfarm-ui
      COMFYFARM_UI_TOKEN_FILE: /run/comfyfarm-ui-agent/token
      VHS_STRICT_PATHS: "1"                 # VideoHelperSuite: no browsing of server paths for users (custom-nodes.md §7)
    volumes:
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/ui-home:/var/lib/comfyfarm-ui
      - ${COMFYFARM_DATA:-/srv/comfyfarm/data}/ui-agent:/run/comfyfarm-ui-agent:ro
      - ${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}:${COMFYFARM_ARTIFACTS_MOUNT:-/srv/comfyfarm/art}:ro
      - ${COMFYFARM_SHARED:-/srv/comfyfarm/shared}:${COMFYFARM_SHARED:-/srv/comfyfarm/shared}
    networks: [front]                       # only the router and the gateway reach it; never the database

networks:
  db:
    internal: true                          # Postgres talks to the router only
  front: {}
  build: {}

